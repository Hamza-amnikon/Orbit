name: Spark Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/spark-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: spark-development-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy to development IIS
    runs-on:
      - self-hosted
      - Windows
    timeout-minutes: 20
    env:
      VITE_APPROVAL_API_BASE_URL: ${{ vars.VITE_APPROVAL_API_BASE_URL }}
      VITE_EMPLOYEE_API_BASE_URL: ${{ vars.VITE_EMPLOYEE_API_BASE_URL }}
      VITE_LEAVE_API_BASE_URL: ${{ vars.VITE_LEAVE_API_BASE_URL }}
      VITE_ONBOARDING_API_URL: ${{ vars.VITE_ONBOARDING_API_URL }}
      VITE_POLICY_API_BASE_URL: ${{ vars.VITE_POLICY_API_BASE_URL }}
      VITE_ATTENDANCE_API_BASE_URL: ${{ vars.VITE_ATTENDANCE_API_BASE_URL }}
      VITE_DOCUMENT_API_BASE_URL: ${{ vars.VITE_DOCUMENT_API_BASE_URL }}
      VITE_EVENT_API_BASE_URL: ${{ vars.VITE_EVENT_API_BASE_URL }}
      VITE_PAYROLL_API_BASE_URL: ${{ vars.VITE_PAYROLL_API_BASE_URL }}
      VITE_PERMISSION_API_BASE_URL: ${{ vars.VITE_PERMISSION_API_BASE_URL }}
      VITE_REIMBURSEMENT_API_BASE_URL: ${{ vars.VITE_REIMBURSEMENT_API_BASE_URL }}
      VITE_SHIFT_API_BASE_URL: ${{ vars.VITE_SHIFT_API_BASE_URL }}
      VITE_ROLE_API_BASE_URL: ${{ vars.VITE_ROLE_API_BASE_URL }}
      VITE_LOCATION_API_BASE_URL: ${{ vars.VITE_LOCATION_API_BASE_URL }}
      VITE_HIERARCHY_API_BASE_URL: ${{ vars.VITE_HIERARCHY_API_BASE_URL }}
      VITE_EMPLOYEE_TYPE_API_BASE_URL: ${{ vars.VITE_EMPLOYEE_TYPE_API_BASE_URL }}
      VITE_DESIGNATION_API_BASE_URL: ${{ vars.VITE_DESIGNATION_API_BASE_URL }}
      VITE_DEPARTMENT_API_BASE_URL: ${{ vars.VITE_DEPARTMENT_API_BASE_URL }}
      VITE_EMPLOYEE_SYNC_API_BASE_URL: ${{ vars.VITE_EMPLOYEE_SYNC_API_BASE_URL }}
      VITE_AUTH_API_BASE_URL: ${{ vars.VITE_AUTH_API_BASE_URL }}

    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm.cmd ci

      - name: Build frontend
        working-directory: frontend
        run: npm.cmd run build

      - name: Validate build output
        run: |
          if (-not (Test-Path -LiteralPath "frontend\dist\index.html" -PathType Leaf)) {
            throw "Build output frontend\dist\index.html was not created."
          }

      - name: Deploy to IIS Spark site
        run: |
          Import-Module WebAdministration

          $siteName = "Spark"
          $deployPath = "C:\inetpub\wwwroot\spark"
          $buildPath = (Resolve-Path -LiteralPath "frontend\dist").Path
          $backupPath = Join-Path $env:RUNNER_TEMP "spark-deployment-backup"
          $savedWebConfig = Join-Path $env:RUNNER_TEMP "spark-web.config"

          if (-not (Test-Path -LiteralPath "IIS:\Sites\$siteName")) {
            throw "IIS site '$siteName' does not exist."
          }

          if (-not (Test-Path -LiteralPath $deployPath -PathType Container)) {
            New-Item -ItemType Directory -Path $deployPath -Force | Out-Null
          }

          if (Test-Path -LiteralPath $backupPath) {
            Remove-Item -LiteralPath $backupPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $backupPath -Force | Out-Null

          & robocopy.exe $deployPath $backupPath /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) {
            throw "Could not back up the current deployment. Robocopy exit code: $LASTEXITCODE"
          }

          $webConfigPath = Join-Path $deployPath "web.config"
          $hasWebConfig = Test-Path -LiteralPath $webConfigPath -PathType Leaf
          if ($hasWebConfig) {
            Copy-Item -LiteralPath $webConfigPath -Destination $savedWebConfig -Force
          }

          try {
            Stop-Website -Name $siteName

            & robocopy.exe $buildPath $deployPath /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -ge 8) {
              throw "Deployment copy failed. Robocopy exit code: $LASTEXITCODE"
            }

            if ($hasWebConfig) {
              Copy-Item -LiteralPath $savedWebConfig -Destination $webConfigPath -Force
            }
          }
          catch {
            Write-Error "Deployment failed. Restoring the previous site files."

            & robocopy.exe $backupPath $deployPath /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -ge 8) {
              Write-Error "Rollback failed. Robocopy exit code: $LASTEXITCODE"
            }

            throw
          }
          finally {
            Start-Website -Name $siteName
          }

          $siteState = (Get-WebsiteState -Name $siteName).Value
          if ($siteState -ne "Started") {
            throw "IIS site '$siteName' did not start. Current state: $siteState"
          }

          Write-Host "Spark frontend deployed successfully to $deployPath."
