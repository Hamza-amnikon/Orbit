name: Spark CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_APPROVAL_API_BASE_URL: ${{ vars.VITE_APPROVAL_API_BASE_URL }}
      VITE_EMPLOYEE_API_BASE_URL: ${{ vars.VITE_EMPLOYEE_API_BASE_URL }}
      VITE_LEAVE_API_BASE_URL: ${{ vars.VITE_LEAVE_API_BASE_URL }}
      VITE_ONBOARDING_API_URL: ${{ vars.VITE_ONBOARDING_API_URL }}
      VITE_POLICY_API_BASE_URL: ${{ vars.VITE_POLICY_API_BASE_URL }}
      VITE_ATTENDANCE_API_BASE_URL: ${{ vars.VITE_ATTENDANCE_API_BASE_URL }}
      VITE_DOCUMENT_API_BASE_URL: ${{ vars.VITE_DOCUMENT_API_BASE_URL }}
      VITE_EVENT_API_BASE_URL: ${{ vars.VITE_EVENT_API_BASE_URL }}
      VITE_PAYROLL_API_BASE_URL: ${{ vars.VITE_PAYROLL_API_BASE_URL }}
      VITE_PERMISSION_API_BASE_URL: ${{ vars.VITE_PERMISSION_API_BASE_URL }}
      VITE_REIMBURSEMENT_API_BASE_URL: ${{ vars.VITE_REIMBURSEMENT_API_BASE_URL }}
      VITE_SHIFT_API_BASE_URL: ${{ vars.VITE_SHIFT_API_BASE_URL }}
      VITE_ROLE_API_BASE_URL: ${{ vars.VITE_ROLE_API_BASE_URL }}
      VITE_LOCATION_API_BASE_URL: ${{ vars.VITE_LOCATION_API_BASE_URL }}
      VITE_HIERARCHY_API_BASE_URL: ${{ vars.VITE_HIERARCHY_API_BASE_URL }}
      VITE_EMPLOYEE_TYPE_API_BASE_URL: ${{ vars.VITE_EMPLOYEE_TYPE_API_BASE_URL }}
      VITE_DESIGNATION_API_BASE_URL: ${{ vars.VITE_DESIGNATION_API_BASE_URL }}
      VITE_DEPARTMENT_API_BASE_URL: ${{ vars.VITE_DEPARTMENT_API_BASE_URL }}
      VITE_EMPLOYEE_SYNC_API_BASE_URL: ${{ vars.VITE_EMPLOYEE_SYNC_API_BASE_URL }}
      VITE_AUTH_API_BASE_URL: ${{ vars.VITE_AUTH_API_BASE_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Upload IIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  deploy-iis:
    name: Deploy to SWVMNVMPRDSPK01 IIS
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: [self-hosted, windows, spark-iis]
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: spark-dist-${{ github.sha }}
          path: ${{ runner.temp }}\spark-dist
      - name: Copy build to IIS site
        shell: powershell
        env:
          IIS_SITE_PATH: ${{ vars.IIS_SITE_PATH }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:IIS_SITE_PATH)) {
            throw 'Configure the production variable IIS_SITE_PATH before deploying.'
          }
          if (-not (Test-Path -LiteralPath $env:IIS_SITE_PATH)) {
            throw "IIS_SITE_PATH does not exist: $env:IIS_SITE_PATH"
          }
          $source = Join-Path $env:RUNNER_TEMP 'spark-dist'
          Copy-Item -Path (Join-Path $source '*') -Destination $env:IIS_SITE_PATH -Recurse -Force
          Write-Host "Deployed Spark build $env:GITHUB_SHA to $env:IIS_SITE_PATH"
