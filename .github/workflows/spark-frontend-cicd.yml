name: Spark Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/spark-frontend-cicd.yml"
  workflow_dispatch:

concurrency:
  group: spark-frontend-deploy-172-31-3-2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy Spark frontend
    runs-on: [self-hosted, Windows, spark-iis, spark-frontend-deploy]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell

    steps:
      - name: Verify deployment target
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ne "SWVMNVMPRDSPK01") {
            throw "Wrong deployment server: $env:COMPUTERNAME"
          }
          $serverAddresses = @(Get-NetIPAddress -AddressFamily IPv4 -ErrorAction Stop | Select-Object -ExpandProperty IPAddress)
          if ($serverAddresses -notcontains "172.31.3.2") {
            throw "Runner is not on deployment server 172.31.3.2. Addresses: $($serverAddresses -join ', ')"
          }
          $deployPath = "C:\inetpub\wwwroot\spark"
          if (-not (Test-Path -LiteralPath $deployPath -PathType Container)) {
            throw "Missing Spark IIS folder: $deployPath"
          }

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create frontend environment file
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:FRONTEND_ENV)) {
            throw "The FRONTEND_ENV GitHub Actions secret is missing or empty."
          }
          $environmentPath = Join-Path $env:GITHUB_WORKSPACE "frontend\.env"
          $overrides = @{
            VITE_ATTENDANCE_API_BASE_URL = "https://sparkapi.amnikontechnologies.com:7136/"
            VITE_PAYROLL_API_BASE_URL = "https://sparkapi.amnikontechnologies.com:5111/"
            VITE_REIMBURSEMENT_API_BASE_URL = "https://sparkapi.amnikontechnologies.com:7282/"
            VITE_ADVANCE_SALARY_API_BASE_URL = "https://sparkapi.amnikontechnologies.com:5125/"
          }
          $lines = $env:FRONTEND_ENV -split "`r?`n"
          $seen = @{}
          for ($index = 0; $index -lt $lines.Length; $index++) {
            if ($lines[$index] -match '^\s*([^#=]+)=(.*)$') {
              $name = $Matches[1].Trim()
              if ($overrides.ContainsKey($name)) {
                $lines[$index] = "$name=$($overrides[$name])"
                $seen[$name] = $true
              }
            }
          }
          # The Advance Salary API was added after the original FRONTEND_ENV
          # secret was created. Keep older secrets deployable by supplying its
          # production URL here when the key is absent.
          $optionalSettings = @("VITE_ADVANCE_SALARY_API_BASE_URL")
          $missing = @($overrides.Keys | Where-Object { -not $seen.ContainsKey($_) -and $_ -notin $optionalSettings })
          if ($missing.Count -gt 0) {
            throw "FRONTEND_ENV is missing required API settings: $($missing -join ', ')"
          }
          foreach ($name in $optionalSettings) {
            if (-not $seen.ContainsKey($name)) {
              $lines += "$name=$($overrides[$name])"
              $seen[$name] = $true
            }
          }
          $apiHost = "sparkapi.amnikontechnologies.com"
          foreach ($line in $lines) {
            if ($line -match '^\s*(VITE_[A-Z0-9_]*(?:API|SERVICE)[A-Z0-9_]*(?:BASE_URL|URL))=(.*)$') {
              $name = $Matches[1].Trim()
              $urlText = $Matches[2].Trim().Trim('"').Trim("'")
              $uri = $null
              if (-not [uri]::TryCreate($urlText, [UriKind]::Absolute, [ref]$uri) -or $uri.Scheme -ne "https" -or $uri.Host -ine $apiHost) {
                throw "FRONTEND_ENV API setting '$name' must use HTTPS on $apiHost."
              }
            }
          }
          [System.IO.File]::WriteAllLines($environmentPath, $lines, [System.Text.UTF8Encoding]::new($false))

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm.cmd ci

      - name: Build frontend
        working-directory: frontend
        run: npm.cmd run build

      - name: Remove temporary environment file
        if: always()
        run: Remove-Item -LiteralPath "frontend\.env" -Force -ErrorAction SilentlyContinue

      - name: Validate frontend build
        run: |
          $indexPath = Join-Path $env:GITHUB_WORKSPACE "frontend\dist\index.html"
          if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) {
            throw "Frontend build failed: frontend\dist\index.html was not created."
          }

      - name: Deploy build to Spark IIS
        run: |
          $ErrorActionPreference = "Stop"
          $deployPath = "C:\inetpub\wwwroot\spark"
          $buildPath = Join-Path $env:GITHUB_WORKSPACE "frontend\dist"
          $backupPath = Join-Path $env:RUNNER_TEMP "spark-frontend-deployment-backup"

          if (Test-Path -LiteralPath $backupPath) {
            Remove-Item -LiteralPath $backupPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $backupPath -Force | Out-Null

          & robocopy.exe $deployPath $backupPath /MIR /R:2 /W:2 /NFL /NDL /NP
          if ($LASTEXITCODE -ge 8) {
            throw "Could not back up the current Spark site (robocopy exit $LASTEXITCODE)."
          }

          try {
            & robocopy.exe $buildPath $deployPath /MIR /R:2 /W:2 /NFL /NDL /NP /XF web.config
            if ($LASTEXITCODE -ge 8) {
              throw "Spark frontend deployment copy failed (robocopy exit $LASTEXITCODE)."
            }
            if (-not (Test-Path -LiteralPath (Join-Path $deployPath "index.html") -PathType Leaf)) {
              throw "Deployment verification failed: Spark index.html is missing."
            }
          } catch {
            & robocopy.exe $backupPath $deployPath /MIR /R:2 /W:2 /NFL /NDL /NP
            if ($LASTEXITCODE -ge 8) {
              Write-Error "Rollback copy failed (robocopy exit $LASTEXITCODE)."
            }
            throw
          }

          exit 0
