name: Spark frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/spark-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/spark-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: spark-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Spark IIS
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, spark-iis]
    steps:
      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: spark-frontend-dist
          path: ${{ runner.temp }}\spark-frontend-dist

      - name: Publish files to IIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'spark-frontend-dist'
          $destination = 'C:\inetpub\wwwroot\spark'

          if (-not (Test-Path -LiteralPath (Join-Path $source 'index.html'))) {
            throw "Build artifact is missing index.html: $source"
          }
          if (-not (Test-Path -LiteralPath $destination)) {
            throw "IIS site directory does not exist: $destination"
          }

          Get-ChildItem -LiteralPath $source -Force |
            Where-Object { $_.Name -ne 'index.html' } |
            Copy-Item -Destination $destination -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $source 'index.html') -Destination (Join-Path $destination 'index.html') -Force
